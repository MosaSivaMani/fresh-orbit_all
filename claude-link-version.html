<title>Fresh Orbit Kakinada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=Anek+Telugu:wght@400;500;600&display=swap">
<style id="fo-style">
/* Layout: harbour-night storefront — sticky header, split hero, filterable product grid, cart drawer that becomes checkout, owner console overlay */
:root{
  --ink:#0A0E14; --surface:#121821; --raised:#18202B; --line:rgba(255,255,255,0.08);
  --text:#F2EDE3; --muted:#9AA3AF; --soft:#C9CFD6;
  --gold:#D8B46A; --gold-hi:#E9CC8C; --gold-lo:#B8924A; --gold-ink:#1A1408;
  --wa:#25D366; --wa-ink:#052E16; --ok:#4ADE80; --ok-deep:#1F7A4D; --warn:#F5B84A; --danger:#F87171;
  --display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --telugu:'Anek Telugu','Noto Sans Telugu','Nirmala UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.te{font-family:var(--telugu)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.serif{font-family:var(--display);font-weight:400}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.announce{background:linear-gradient(90deg,var(--gold-lo),var(--gold),var(--gold-lo));color:var(--gold-ink);font-size:13px;font-weight:700;text-align:center}
.announce .wrap{padding-block:8px}
.closed{background:#3A2A10;color:var(--warn);font-size:13px;font-weight:700;text-align:center;border-bottom:1px solid rgba(245,184,74,0.35)}
.closed .wrap{padding-block:10px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(10,14,20,0.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(216,180,106,0.2)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1;white-space:nowrap}
.brand i{color:var(--gold)}
.brand small{display:block;font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
nav.links{display:flex;gap:26px;font-size:14px;font-weight:600;color:var(--soft)}
nav.links a{text-decoration:none}
nav.links a:hover{color:var(--gold-hi)}
.hdr-actions{display:flex;gap:8px;align-items:center}
.pill-btn{height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;white-space:nowrap}
.pill-btn:hover{border-color:rgba(216,180,106,0.5)}
.pill-gold{background:rgba(216,180,106,0.14);border-color:rgba(216,180,106,0.55);color:var(--gold-hi)}
.badge{min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--gold);color:var(--gold-ink);font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
@media (max-width:900px){nav.links{display:none}}
@media (max-width:420px){.brand small{display:none}.brand b{font-size:22px}.pill-btn{padding:0 11px}}

.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;padding-block:56px 40px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,7vw,84px);line-height:0.98;letter-spacing:-1px;margin:14px 0 14px;text-wrap:balance}
.hero h1 em{color:var(--gold-hi)}
.hero .te-line{font-size:19px;color:var(--muted);margin:0}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 28px}
.fact{display:flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--soft)}
.fact svg{color:var(--gold)}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}
.btn-gold{height:56px;padding:0 26px;border-radius:28px;border:0;background:linear-gradient(135deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));color:var(--gold-ink);font-size:15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;box-shadow:0 14px 30px rgba(0,0,0,0.4)}
.btn-gold:hover{filter:brightness(1.06)}
.btn-gold:disabled{opacity:.5;filter:none}
.btn-ghost{height:56px;padding:0 24px;border-radius:28px;border:1px solid rgba(255,255,255,0.14);background:transparent;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-ghost:hover{border-color:var(--gold)}
.feature{position:relative;display:block;width:100%;padding:0;text-align:left;border-radius:30px;overflow:hidden;border:1px solid rgba(216,180,106,0.3);aspect-ratio:4/3.3;max-width:100%;background:var(--surface)}
.feature img,.feature .mono{width:100%;height:100%;object-fit:cover;display:flex}
.feature::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,20,0) 40%,rgba(10,14,20,0.92) 100%)}
.feature .cap{position:absolute;left:24px;right:24px;bottom:22px;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.feature .tag{position:absolute;top:18px;left:18px;z-index:1;font-size:10px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;background:var(--gold);color:var(--gold-ink);padding:6px 10px;border-radius:8px}
.feature .nm{font-family:var(--display);font-size:36px;line-height:1}
.feature .price{font-size:22px;font-weight:800;color:var(--gold-hi);white-space:nowrap}
.feature .price span{font-size:13px;font-weight:500;color:var(--muted)}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;gap:28px;padding-block:32px 24px}}

.shop{padding-block:40px 30px}
.shop-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.shop-head h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,4.5vw,48px);line-height:1;margin:8px 0 0}
.search{height:52px;width:min(380px,100%);display:flex;align-items:center;gap:10px;padding:0 18px;border-radius:26px;background:var(--surface);border:1px solid var(--line)}
.search:focus-within{border-color:var(--gold)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:14px}
.search input::placeholder{color:#7C8794}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:26px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;min-height:54px;padding:6px 18px;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.cat b{font-size:14px}
.cat span{font-size:12px;opacity:0.75}
.cat[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.group{margin-bottom:38px}
.group-title{display:flex;align-items:baseline;gap:12px;margin:0 0 16px;flex-wrap:wrap}
.group-title h3{font-family:var(--display);font-weight:400;font-size:30px;margin:0}
.group-title .sub{color:var(--muted);font-size:17px}
.group-title .count{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.card{background:var(--surface);border:1px solid rgba(255,255,255,0.06);border-radius:24px;padding:7px 7px 14px;display:flex;flex-direction:column;gap:12px;transition:border-color .2s,transform .2s;min-width:0}
.card:hover{border-color:rgba(216,180,106,0.4);transform:translateY(-2px)}
.card .ph{position:relative;display:block;width:100%;aspect-ratio:1/0.82;border-radius:18px;overflow:hidden;border:0;padding:0;background:var(--raised)}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover .ph img{transform:scale(1.04)}
.mono{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,rgba(216,180,106,0.22),rgba(216,180,106,0.04) 60%),var(--raised);font-family:var(--display);font-size:64px;color:var(--gold-hi)}
.best{position:absolute;top:9px;left:9px;font-size:9px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;background:var(--gold);color:var(--gold-ink);padding:4px 8px;border-radius:6px}
.out{position:absolute;inset:0;background:rgba(10,14,20,0.72);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--text)}
.card .meta{padding:0 8px;display:flex;flex-direction:column;min-width:0}
.card .meta b{font-size:16px;overflow-wrap:anywhere}
.card .meta .alt{font-size:14px;color:var(--muted)}
.card .foot{padding:0 4px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.price-tag{font-size:17px;font-weight:800;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.price-tag small{font-size:12px;font-weight:500;color:var(--muted)}
.add{width:44px;height:44px;flex:0 0 auto;border-radius:22px;border:1px solid rgba(216,180,106,0.5);background:transparent;color:var(--gold);display:flex;align-items:center;justify-content:center}
.add:hover:not(:disabled){background:var(--gold);color:var(--gold-ink)}
.add:disabled{opacity:.35}
.in-cart{height:44px;padding:0 12px;border-radius:22px;background:rgba(216,180,106,0.14);border:1px solid rgba(216,180,106,0.45);color:var(--gold-hi);font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:22px}

.band{border-top:1px solid var(--line)}
.band .wrap{padding-block:64px}
.band h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,4.5vw,48px);line-height:1;margin:8px 0 28px;text-wrap:balance}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
.step{padding:26px;border-radius:24px;background:var(--surface);border:1px solid var(--line)}
.step .n{font-family:var(--display);font-size:44px;line-height:1;color:var(--gold)}
.step h3{margin:12px 0 6px;font-size:17px}
.step p{margin:0;color:var(--soft);font-size:14px}
.step .te{display:block;margin-top:8px;color:var(--muted);font-size:14px}
.areas-layout{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
@media (max-width:860px){.areas-layout{grid-template-columns:1fr}}
.area-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden}
@media (max-width:480px){.area-list{grid-template-columns:1fr}}
.area-list div{display:flex;justify-content:space-between;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line);font-size:14px}
.area-list div b{color:var(--gold-hi);font-variant-numeric:tabular-nums}
.rules{display:flex;flex-direction:column;gap:12px}
.rule{display:flex;gap:14px;align-items:center;padding:18px 20px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.rule svg{flex:0 0 auto;color:var(--gold)}
.rule b{display:block;font-size:15px}
.rule span{font-size:13px;color:var(--muted)}
footer{border-top:1px solid rgba(216,180,106,0.2)}
footer .wrap{padding-block:30px 110px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;color:var(--muted);font-size:13px}

.cartbar{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;max-width:560px;margin:0 auto;height:66px;border-radius:33px;border:0;background:linear-gradient(135deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));color:var(--gold-ink);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 8px 0 24px;box-shadow:0 18px 40px rgba(0,0,0,0.55);text-align:left}
.cartbar > span:first-child{min-width:0;overflow:hidden}
.cartbar .t{font-size:18px;font-weight:800;line-height:1.1}
.cartbar .s{font-size:12px;font-weight:700;opacity:0.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cartbar .go{flex:0 0 auto;height:50px;padding:0 20px;border-radius:25px;background:var(--ink);color:var(--gold-hi);font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}

.scrim{position:fixed;inset:0;z-index:70;background:rgba(3,5,8,0.66);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal{position:fixed;z-index:80;left:50%;top:50%;transform:translate(-50%,-50%);width:min(860px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:#0F141C;border:1px solid rgba(216,180,106,0.25);border-radius:30px;display:grid;grid-template-columns:1fr 1fr}
.modal .mimg{position:relative;min-height:340px;background:var(--raised)}
.modal .mimg img,.modal .mimg .mono{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.modal .mbody{padding:30px;display:flex;flex-direction:column;gap:18px;min-width:0}
.xbtn{position:absolute;top:14px;right:14px;z-index:2;width:44px;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,0.18);background:rgba(10,14,20,0.7);display:flex;align-items:center;justify-content:center}
.label{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:block}
.seg{display:grid;gap:6px;padding:5px;background:var(--ink);border:1px solid var(--line);border-radius:18px}
.seg button{min-height:44px;border-radius:14px;border:0;background:transparent;color:var(--soft);font-size:13px;font-weight:700;padding:4px 6px}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.wts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wts button{height:58px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.wts button b{font-size:14px}
.wts button span{font-size:11px;color:var(--muted)}
.wts button[aria-pressed="true"]{border:1.5px solid var(--gold);background:rgba(216,180,106,0.14)}
@media (max-width:700px){
  .modal{left:0;right:0;top:auto;bottom:0;transform:none;width:100%;max-height:92%;border-radius:28px 28px 0 0;grid-template-columns:1fr;padding-bottom:env(safe-area-inset-bottom,0px)}
  .modal .mimg{min-height:240px}
  .modal .mbody{padding:22px max(20px,env(safe-area-inset-left,0px)) 24px}
}

.drawer{position:fixed;z-index:80;top:0;right:0;bottom:0;width:min(460px,100%);background:#0F141C;border-left:1px solid rgba(216,180,106,0.25);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid rgba(216,180,106,0.2)}
.dhead h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;flex:1;line-height:1.1}
.icon-btn{width:44px;height:44px;flex:0 0 auto;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.dbody{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.dfoot{padding:14px 20px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.line{display:flex;gap:14px;padding:10px;background:var(--surface);border:1px solid rgba(255,255,255,0.06);border-radius:20px}
.line .th{width:76px;height:76px;flex:0 0 auto;border-radius:14px;overflow:hidden}
.line .th img,.line .th .mono{width:100%;height:100%;object-fit:cover;font-size:30px}
.line .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.line .row{display:flex;justify-content:space-between;gap:8px}
.line b{font-size:15px}
.line .sub{font-size:12px;color:var(--muted)}
.stepper{align-self:flex-start;display:flex;align-items:center;background:var(--ink);border:1px solid var(--line);border-radius:22px}
.stepper button{width:44px;height:38px;border:0;background:transparent;color:var(--gold);display:flex;align-items:center;justify-content:center}
.stepper span{min-width:58px;text-align:center;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.progress{padding:16px;border-radius:18px;background:rgba(216,180,106,0.08);border:1px solid rgba(216,180,106,0.25);display:flex;flex-direction:column;gap:10px;font-size:13px;font-weight:600;color:var(--gold-hi)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,0.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));transition:width .3s}
.sum{display:flex;flex-direction:column;gap:8px;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.sum .k{color:var(--muted)}
.sum .total{padding-top:10px;border-top:1px solid var(--line);align-items:baseline}
.sum .total .k{font-family:var(--display);font-size:24px;color:var(--text)}
.sum .total b{font-size:24px;color:var(--gold-hi)}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field > span{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.field > span.money,.field > span.phone{font-size:15px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--text)}
.field input,.field textarea,.field select{min-height:50px;padding:12px 16px;border-radius:14px;border:1px solid rgba(255,255,255,0.1);background:var(--surface);font-size:15px;outline:0;resize:vertical;width:100%;min-width:0}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold)}
.field input::placeholder,.field textarea::placeholder{color:#7C8794}
.err{font-size:12px;color:var(--warn);font-weight:600;font-style:normal}
.phone{display:flex;align-items:center;border-radius:14px;border:1px solid rgba(255,255,255,0.1);background:var(--surface);overflow:hidden}
.phone:focus-within{border-color:var(--gold)}
.phone b{padding:0 14px;align-self:stretch;display:flex;align-items:center;border-right:1px solid var(--line);color:var(--soft)}
.phone input{border:0!important;flex:1;min-width:0;background:transparent}
.area-pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.area-pick button{min-height:50px;padding:8px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;font-size:13px;font-weight:600;line-height:1.2;min-width:0}
.area-pick button b{font-size:12px;color:var(--muted);flex:0 0 auto}
.area-pick button[aria-pressed="true"]{border:1.5px solid var(--gold);background:rgba(216,180,106,0.14)}
.area-pick button[aria-pressed="true"] b{color:var(--gold-hi)}
.btn-wa{height:60px;border-radius:30px;border:0;background:var(--wa);color:var(--wa-ink);font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;width:100%}
.btn-wa:hover{filter:brightness(1.05)}
.btn-wa:disabled{opacity:.45}
.note{font-size:12px;color:var(--muted);text-align:center}
.msgbox{white-space:pre-wrap;font-size:13px;line-height:1.55;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;color:var(--soft);max-height:240px;overflow:auto;overflow-wrap:anywhere}
.done-ico{width:64px;height:64px;border-radius:32px;background:rgba(37,211,102,0.14);border:1px solid rgba(37,211,102,0.4);display:flex;align-items:center;justify-content:center;color:var(--wa)}
.toast{position:fixed;z-index:120;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);min-height:46px;padding:8px 18px 8px 12px;border-radius:23px;background:var(--text);color:var(--ink);display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;box-shadow:0 14px 30px rgba(0,0,0,0.5);max-width:calc(100% - 32px)}
.toast i{width:24px;height:24px;flex:0 0 auto;border-radius:12px;background:var(--ok-deep);display:flex;align-items:center;justify-content:center;color:#fff}

/* ---------- owner console ---------- */
.admin{position:fixed;inset:0;z-index:100;background:var(--ink);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.ahead{position:sticky;top:0;z-index:2;background:rgba(10,14,20,0.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(216,180,106,0.2)}
.ahead .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding-block:14px;max-width:980px}
#aClose{order:3}
.atabs{order:2}
@media (max-width:700px){#aClose{order:2}.atabs{order:3;max-width:none}}
.ahead h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;line-height:1.1;flex:1;min-width:0}
.atabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:20px;width:100%;max-width:420px}
.atabs button{height:44px;border-radius:15px;border:0;background:transparent;color:var(--soft);font-size:14px;font-weight:700}
.atabs button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);font-weight:800}
.abody{max-width:980px;padding-block:20px 140px;display:flex;flex-direction:column;gap:14px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.acard h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.acard .hint{font-size:13px;color:var(--muted);margin:-8px 0 0}
.arow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:start}
@media (max-width:640px){.arow{grid-template-columns:64px minmax(0,1fr)}.arow .atoggles{grid-column:1 / -1;flex-direction:row}}
.athumb{position:relative;width:76px;height:76px;border-radius:16px;overflow:hidden;border:1px dashed rgba(216,180,106,0.5);background:var(--raised);padding:0;display:block}
@media (max-width:640px){.athumb{width:64px;height:64px}}
.athumb img,.athumb .mono{width:100%;height:100%;object-fit:cover;font-size:30px}
.athumb span.cam{position:absolute;right:4px;bottom:4px;width:24px;height:24px;border-radius:12px;background:rgba(10,14,20,0.85);display:flex;align-items:center;justify-content:center;color:var(--gold-hi)}
.afields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;min-width:0}
@media (max-width:520px){.afields{grid-template-columns:1fr}}
.afields .field > span,.ad .field > span{font-size:11px;letter-spacing:1px}
.afields .field input,.afields .field select,.ad .field input,.ad .field select,.ad .field textarea{min-height:44px;padding:9px 12px;font-size:14px;background:var(--ink)}
.money{display:flex;align-items:center;border-radius:14px;border:1px solid rgba(255,255,255,0.1);background:var(--ink);padding:0 12px;min-height:44px}
.money:focus-within{border-color:var(--gold)}
.money input{border:0!important;background:transparent!important;min-height:42px!important;padding:0 6px!important;flex:1;min-width:0;font-weight:800;color:var(--gold-hi)}
.money em{font-style:normal;font-size:12px;color:var(--muted)}
.atoggles{display:flex;flex-direction:column;gap:8px}
.tgl{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 4px;border:0;background:transparent;font-size:13px;font-weight:700;color:var(--soft);white-space:nowrap}
.tgl .trk{width:46px;height:28px;border-radius:14px;background:rgba(255,255,255,0.14);position:relative;flex:0 0 auto;transition:background .2s}
.tgl .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:var(--muted);transition:left .2s,background .2s}
.tgl[aria-checked="true"] .trk{background:var(--ok-deep)}
.tgl[aria-checked="true"] .trk::after{left:21px;background:#fff}
.amore{grid-column:1 / -1}
.amore summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--gold-hi);min-height:36px;display:flex;align-items:center;list-style:none}
.amore summary::-webkit-details-marker{display:none}
.amore[open] summary{margin-bottom:10px}
.ad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.ad{grid-template-columns:1fr}}
.ad .wide{grid-column:1 / -1}
.lnk{border:0;background:transparent;font-size:13px;font-weight:700;color:var(--soft);min-height:40px;padding:0 6px;text-decoration:underline;text-underline-offset:3px}
.lnk.danger{color:var(--danger)}
.out-row{opacity:.62}
.alist{display:flex;flex-direction:column;gap:8px}
.aline{display:grid;grid-template-columns:minmax(0,1fr) 110px 44px;gap:8px;align-items:center}
.aline input{min-height:44px;padding:9px 12px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:var(--ink);font-size:14px;outline:0;width:100%;min-width:0}
.aline input:focus{border-color:var(--gold)}
.aline.slot{grid-template-columns:minmax(0,1fr) 44px}
.xsm{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.xsm:hover{color:var(--danger)}
.dashed{min-height:46px;border-radius:14px;border:1px dashed rgba(216,180,106,0.5);background:transparent;color:var(--gold);font-size:14px;font-weight:700}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:105;background:rgba(15,20,28,0.97);border-top:1px solid rgba(216,180,106,0.3);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{max-width:980px;display:flex;align-items:center;gap:10px;padding-block:12px;flex-wrap:wrap}
.savebar .msg{flex:1;min-width:160px;font-size:13px;font-weight:600;color:var(--muted)}
.savebar .msg.dirty{color:var(--warn)}
.savebar .btn-gold,.savebar .btn-ghost{height:50px}
.busy{position:fixed;inset:0;z-index:130;background:rgba(3,5,8,0.8);display:flex;align-items:center;justify-content:center;padding:24px}
.busy div{max-width:360px;text-align:center;background:var(--surface);border:1px solid rgba(216,180,106,0.35);border-radius:24px;padding:28px}
.spin{width:40px;height:40px;margin:0 auto 14px;border-radius:20px;border:3px solid rgba(216,180,106,0.25);border-top-color:var(--gold);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.confirm-del{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--danger);font-weight:700}
.confirm-del button{min-height:40px;padding:0 14px;border-radius:12px;font-size:13px;font-weight:800}
</style>

  ds.areas = ds.areas.filter((a) => a.name.trim()).map((a) => ({ name: a.name.trim(), fee: a.fee }));
  if (!ds.slots.length) problems.push('Add at least one delivery time slot.');
  if (!ds.areas.length) problems.push('Add at least one delivery area.');
  if (!draft.products.length) problems.push('Add at least one product.');
  return problems;
}
const RESET = ':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';
function buildPage(data) {
  const json = JSON.stringify(data).replace(/</g, '\\u003c').split(String.fromCharCode(0x2028)).join('\\u2028').split(String.fromCharCode(0x2029)).join('\\u2029');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>\n' +
    '<title>Fresh Orbit Kakinada</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' +

}
window.__foBuildPage = buildPage; /* used by the local test only */
async function publishDraft() {
  const problems = validateDraft();
  if (problems.length) { $('saveMsg').textContent = problems[0]; $('saveMsg').classList.add('dirty'); renderAdmin(); return; }
  draft.updatedAt = new Date().toISOString();
  const html = buildPage(draft);
  $('busy').hidden = false; $('busyTitle').textContent = 'Publishing…'; $('busyText').textContent = 'The shop updates for every customer in a moment.';
  try {
    await ARTIFACT.publish(html);
    $('busyTitle').textContent = 'Published'; $('busyText').textContent = 'Reloading the shop…';
  } catch (err) {
    const code = err && err.code;
    $('busy').hidden = true;
    const msgs = {
      conflict: 'Someone saved a newer version first. The page is reloading to it; make your change again.',
      not_writer: 'This account can view the shop but cannot change it.',
      not_granted: 'Saving is not available in this view. Open the shop link while signed in as the owner.',
      too_large: 'The page is too big to save. Remove some product photos and try again.',
      rate_limited: 'Saved too often in a short time. Wait a minute, then press Save & publish again.'
    };
    $('saveMsg').textContent = msgs[code] || 'Could not publish right now. Check your connection and try again.';
    $('saveMsg').classList.add('dirty');
  }
}

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button,a'); if (!t) return;
  if (!$('admin').hidden && $('admin').contains(t)) { if (onAdminClick(t)) return; }
  if (t.dataset.cat) { cat = t.dataset.cat; renderCats(); renderGroups(); return; }
  if (t.dataset.open) { openProduct(t.dataset.open); return; }
  if (t.dataset.cut !== undefined && mState) { mState.cut = t.dataset.cut; renderModalOpts(); return; }
  if (t.dataset.w !== undefined && mState) { mState.w = +t.dataset.w; renderModalOpts(); return; }
  if (t.dataset.inc || t.dataset.dec) {
    const i = +(t.dataset.inc || t.dataset.dec), l = cart[i], st = stepFor(prod(l.id));
    if (t.dataset.inc) l.qty = +(l.qty + st).toFixed(3); else { l.qty = +(l.qty - st).toFixed(3); if (l.qty <= 0.001) cart.splice(i, 1); }
    save(); renderDrawer(); renderGroups(); renderBar(); return;
  }
  if (t.dataset.area !== undefined) { readForm(); form.area = S.areas[+t.dataset.area].name; save(); renderDrawer(); return; }
  if (t.dataset.slot !== undefined) { readForm(); form.slot = S.slots[+t.dataset.slot]; save(); renderDrawer(); return; }
  const act = t.dataset.act;
  if (act === 'close') return closeLayers();
  if (act === 'checkout') { view = 'checkout'; renderDrawer(); $('dBody').scrollTop = 0; return; }
  if (act === 'send') { if (!validate()) return; view = 'sent'; renderDrawer(); return; }
  if (act === 'copy') {
    const msg = buildMessage();
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($('msgBox')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Message selected. Copy it.'); };
    try { navigator.clipboard.writeText(msg).then(() => toast('Order message copied'), fallback); } catch (err) { fallback(); }
    return;
  }
  if (act === 'new') { cart = []; save(); view = 'cart'; closeLayers(); renderGroups(); renderBar(); return; }
});

  if (!$('admin').hidden && $('admin').contains(e.target)) { onAdminInput(e); return; }

  if (e.key !== 'Escape') return;

greet(); applyLang(); renderBar();

/* Owner detection: only someone who can edit this page sees "Manage shop". */
(async function () {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const results = await Promise.all([window.claude.use('user'), window.claude.use('artifact')]);
    const user = results[0], art = results[1];
    const can = user ? await user.canEdit() : false;
    if (can && art) { ARTIFACT = art; isOwner = true; $('manageBtn').hidden = false; }
  } catch (e) { /* customer view */ }
})();
})();
