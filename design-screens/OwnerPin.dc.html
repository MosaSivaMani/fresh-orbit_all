<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fresh Orbit · Owner PIN</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@400;500;600;700;800&amp;family=Anek+Telugu:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05080C}
a{color:inherit;text-decoration:none}a:hover{color:#E9CC8C}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: radial-gradient(120% 60% at 50% 0%, #172131 0%, #0A0E14 60%); color: #F2EDE3; font-family: 'Manrope', system-ui, sans-serif; border-radius: 36px; display: flex; flex-direction: column; align-items: center">

  <a href="Main.dc.html" style="align-self: flex-start; margin: 18px 0 0 16px; height: 44px; padding: 0 16px 0 10px; border-radius: 22px; background: #121821; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Back to shop</a>

  <div style="margin-top: 48px; width: 72px; height: 72px; border-radius: 24px; background: rgba(216,180,106,0.1); border: 1px solid rgba(216,180,106,0.35); display: flex; align-items: center; justify-content: center">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#D8B46A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path><circle cx="12" cy="15.5" r="1.2" fill="#D8B46A"></circle></svg>
  </div>
  <h1 style="margin: 20px 0 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 38px">Shop owner</h1>
  <span style="font-family: 'Anek Telugu', sans-serif; font-size: 16px; color: #9AA3AF">షాప్ ఓనర్ · PIN ఎంటర్ చేయండి</span>

  <div role="img" aria-label="{{dotsLabel}}" style="display: flex; gap: 18px; margin-top: 34px">
    <sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
      <span style="width: 16px; height: 16px; border-radius: 8px; border: 1.5px solid #D8B46A; background: {{d.fill}}"></span>
    </sc-for>
  </div>

  <div style="margin-top: 40px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 22px; width: 270px">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <sc-if value="{{k.isKey}}" hint-placeholder-val="{{ true }}">
        <button onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 72px; border-radius: 36px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); color: #F2EDE3; font-size: 26px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{k.label}}</button>
      </sc-if>
      <sc-if value="{{k.isBlank}}" hint-placeholder-val="{{ false }}"><span></span></sc-if>
    </sc-for>
  </div>

  <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
    <a href="OwnerProducts.dc.html" style="margin-top: 28px; width: 270px; height: 58px; border-radius: 29px; background: linear-gradient(135deg, #E9CC8C 0%, #D8B46A 55%, #B8924A 100%); color: #1A1408; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">Unlock dashboard</a>
  </sc-if>
  <sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}">
    <span style="margin-top: 28px; height: 58px; display: flex; align-items: center; font-size: 13px; color: #9AA3AF">Enter your 4-digit PIN to manage the shop</span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { pin: '12' }; }
  renderVals() {
    const pin = this.state.pin;
    const dots = [0,1,2,3].map((i) => ({ fill: i < pin.length ? '#D8B46A' : 'transparent' }));
    const labels = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
    const keys = labels.map((l) => ({
      label: l, isKey: l !== '', isBlank: l === '',
      aria: l === '⌫' ? 'Delete' : l,
      press: () => {
        if (l === '⌫') this.setState({ pin: pin.slice(0, -1) });
        else if (pin.length < 4) this.setState({ pin: pin + l });
      }
    }));
    return { dots, keys, ready: pin.length === 4, notReady: pin.length < 4, dotsLabel: pin.length + ' of 4 digits entered' };
  }
}
</script>
</body>
</html>
