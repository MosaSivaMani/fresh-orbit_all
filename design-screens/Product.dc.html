<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fresh Orbit · Product</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@400;500;600;700;800&amp;family=Anek+Telugu:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05080C}
a{color:inherit;text-decoration:none}a:hover{color:#E9CC8C}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0E14; color: #F2EDE3; font-family: 'Manrope', system-ui, sans-serif; border-radius: 36px">

  <!-- Image -->
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 400px">
    <img src="/_blob/e4abe9bf15a2e65149ffe3e646b71952" alt="Fresh prawns on ice in a dark bowl" style="width: 100%; height: 100%; object-fit: cover; display: block">
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,20,0.55) 0%, rgba(10,14,20,0) 30%, rgba(10,14,20,0) 70%, rgba(10,14,20,0.9) 100%)"></div>
  </div>
  <div style="position: absolute; top: 18px; left: 16px; right: 16px; display: flex; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Back to shop" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(10,14,20,0.6); border: 1px solid rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2EDE3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <button aria-label="Save to favourites" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(10,14,20,0.6); border: 1px solid rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F2EDE3" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"></path></svg></button>
  </div>

  <!-- Sheet -->
  <section style="position: absolute; left: 0; right: 0; top: 360px; bottom: 0; background: #0F141C; border-radius: 30px 30px 0 0; border-top: 1px solid rgba(216,180,106,0.25); padding: 12px 22px 0; display: flex; flex-direction: column; gap: 18px">
    <span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18)"></span>
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #D8B46A">Prawns &amp; Crab</span>
        <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 40px; line-height: 1.05">Prawns</h1>
        <span style="font-family: 'Anek Telugu', sans-serif; font-size: 16px; color: #9AA3AF">రొయ్యలు</span>
      </div>
      <div style="text-align: right">
        <div style="font-size: 26px; font-weight: 800; color: #E9CC8C">₹480</div>
        <div style="font-size: 12px; color: #9AA3AF">per kg</div>
      </div>
    </div>
    <p style="margin: 0; font-size: 14px; line-height: 1.55; color: #C9CFD6">Medium size, 40 to 50 per kg. Cleaned on request at the shop before dispatch.</p>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #9AA3AF">Cut · <span style="font-family: 'Anek Telugu', sans-serif; letter-spacing: 0; text-transform: none">కట్</span></span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 5px; background: #0A0E14; border: 1px solid rgba(255,255,255,0.07); border-radius: 18px">
        <sc-for list="{{cuts}}" as="c" hint-placeholder-count="2">
          <button onClick="{{c.pick}}" style="height: 44px; border-radius: 14px; border: 0; background: {{c.bg}}; color: {{c.color}}; font-size: 13px; font-weight: 700">{{c.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #9AA3AF">Quantity</span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{weights}}" as="w" hint-placeholder-count="4">
          <button onClick="{{w.pick}}" style="height: 56px; border-radius: 16px; border: {{w.border}}; background: {{w.bg}}; color: #F2EDE3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px">
            <span style="font-size: 14px; font-weight: 800">{{w.label}}</span>
            <span style="font-size: 11px; color: #9AA3AF">{{w.price}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <a href="Cart.dc.html" style="margin-top: auto; margin-bottom: 26px; height: 60px; border-radius: 30px; background: linear-gradient(135deg, #E9CC8C 0%, #D8B46A 55%, #B8924A 100%); color: #1A1408; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 800; box-shadow: 0 14px 30px rgba(0,0,0,0.45)">Add to cart · {{total}}</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { cut: 0, w: 0 }; }
  renderVals() {
    const cuts = ['Cleaned & deveined', 'Whole'].map((label, i) => {
      const on = this.state.cut === i;
      return { label, pick: () => this.setState({ cut: i }), bg: on ? '#D8B46A' : 'transparent', color: on ? '#1A1408' : '#C9CFD6' };
    });
    const opts = [['250 g', 120], ['500 g', 240], ['1 kg', 480], ['2 kg', 960]];
    const weights = opts.map(([label, price], i) => {
      const on = this.state.w === i;
      return { label, price: '₹' + price, pick: () => this.setState({ w: i }),
        bg: on ? 'rgba(216,180,106,0.14)' : '#121821',
        border: on ? '1.5px solid #D8B46A' : '1px solid rgba(255,255,255,0.08)' };
    });
    return { cuts, weights, total: '₹' + opts[this.state.w][1] };
  }
}
</script>
</body>
</html>
