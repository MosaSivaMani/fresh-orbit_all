<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fresh Orbit · Cart</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@400;500;600;700;800&amp;family=Anek+Telugu:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05080C}
a{color:inherit;text-decoration:none}a:hover{color:#E9CC8C}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0E14; color: #F2EDE3; font-family: 'Manrope', system-ui, sans-serif; border-radius: 36px; display: flex; flex-direction: column">

  <header style="display: flex; align-items: center; gap: 14px; padding: 18px 20px 16px; border-bottom: 1px solid rgba(216,180,106,0.18)">
    <a href="Main.dc.html" aria-label="Back to shop" style="width: 44px; height: 44px; border-radius: 22px; background: #121821; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2EDE3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 32px; flex: 1">Your cart</h1>
    <span style="font-size: 12px; font-weight: 700; color: #9AA3AF">2 items</span>
  </header>

  <div style="padding: 20px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="2">
      <article style="display: flex; gap: 14px; padding: 10px; background: #121821; border: 1px solid rgba(255,255,255,0.06); border-radius: 22px">
        <img src="{{it.img}}" alt="{{it.en}}" style="width: 84px; height: 84px; border-radius: 16px; object-fit: cover; display: block">
        <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-width: 0">
          <div style="display: flex; justify-content: space-between; gap: 8px">
            <div style="display: flex; flex-direction: column">
              <span style="font-size: 15px; font-weight: 700">{{it.en}} <span style="font-family: 'Anek Telugu', sans-serif; font-size: 13px; font-weight: 500; color: #9AA3AF">{{it.te}}</span></span>
              <span style="font-size: 12px; color: #9AA3AF">{{it.meta}}</span>
            </div>
            <span style="font-size: 15px; font-weight: 800; color: #E9CC8C">{{it.total}}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 4px; align-self: flex-start; background: #0A0E14; border: 1px solid rgba(255,255,255,0.08); border-radius: 22px">
            <button onClick="{{it.dec}}" aria-label="Less {{it.en}}" style="width: 44px; height: 40px; border: 0; background: transparent; color: #D8B46A; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
            <span style="min-width: 54px; text-align: center; font-size: 13px; font-weight: 800">{{it.qty}}</span>
            <button onClick="{{it.inc}}" aria-label="More {{it.en}}" style="width: 44px; height: 40px; border: 0; background: transparent; color: #D8B46A; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
          </div>
        </div>
      </article>
    </sc-for>
  </div>

  <!-- Free delivery progress -->
  <div style="margin: 0 20px; padding: 16px; border-radius: 20px; background: rgba(216,180,106,0.08); border: 1px solid rgba(216,180,106,0.25); display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D8B46A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"></path><circle cx="7" cy="17.5" r="1.6"></circle><circle cx="17" cy="17.5" r="1.6"></circle></svg>
      <span style="font-size: 13px; font-weight: 600; color: #E9CC8C">{{freeMsg}}</span>
    </div>
    <div style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden"><div style="height: 100%; width: {{pct}}; border-radius: 3px; background: linear-gradient(90deg, #B8924A, #E9CC8C)"></div></div>
  </div>

  <!-- Summary -->
  <div style="margin: 16px 20px 0; padding: 18px; border-radius: 22px; background: #121821; border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #9AA3AF">Items</span><span style="font-weight: 700">{{sub}}</span></div>
    <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #9AA3AF">Delivery</span><span style="color: #9AA3AF">Choose area at checkout</span></div>
    <div style="height: 1px; background: rgba(255,255,255,0.08)"></div>
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-family: 'Instrument Serif', serif; font-size: 24px">Total</span><span style="font-size: 24px; font-weight: 800; color: #E9CC8C">{{sub}}</span></div>
  </div>

  <a href="Checkout.dc.html" style="margin: auto 16px 24px; height: 62px; border-radius: 31px; background: linear-gradient(135deg, #E9CC8C 0%, #D8B46A 55%, #B8924A 100%); color: #1A1408; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 800; box-shadow: 0 14px 30px rgba(0,0,0,0.45)">Continue to delivery <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { a: 1.5, b: 0.25 }; }
  renderVals() {
    const fmt = (n) => '₹' + Math.round(n).toLocaleString('en-IN');
    const kg = (q) => q < 1 ? Math.round(q * 1000) + ' g' : q + ' kg';
    const defs = [
      { key: 'a', en: 'Mackerel', te: 'కనగడత', rate: 280, step: 0.5, img: '/_blob/52259cb91a2512a93f9f7126746b2bf6' },
      { key: 'b', en: 'Prawns', te: 'రొయ్యలు', rate: 480, step: 0.25, img: '/_blob/6e699b3aa3417c8910227af23fcbaad5' }
    ];
    let sub = 0;
    const items = defs.map((d) => {
      const q = this.state[d.key];
      sub += q * d.rate;
      return { en: d.en, te: d.te, img: d.img, meta: 'Whole · ₹' + d.rate + '/kg', qty: kg(q), total: fmt(q * d.rate),
        inc: () => this.setState({ [d.key]: q + d.step }),
        dec: () => this.setState({ [d.key]: Math.max(d.step, q - d.step) }) };
    });
    const left = Math.max(0, 999 - sub);
    return { items, sub: fmt(sub),
      freeMsg: left > 0 ? 'Add ' + fmt(left) + ' more for free delivery' : 'You’ve unlocked free delivery',
      pct: Math.min(100, Math.round(sub / 999 * 100)) + '%' };
  }
}
</script>
</body>
</html>
