<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fresh Orbit · Owner delivery</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@400;500;600;700;800&amp;family=Anek+Telugu:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05080C}
a{color:inherit;text-decoration:none}a:hover{color:#E9CC8C}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
input::placeholder{color:#7C8794}
input:focus,textarea:focus{outline:none;border-color:#D8B46A !important}
</style>
</helmet>
<div style="width: 390px; height: 1900px; position: relative; overflow: hidden; background: #0A0E14; color: #F2EDE3; font-family: 'Manrope', system-ui, sans-serif; border-radius: 36px; display: flex; flex-direction: column">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 16px; border-bottom: 1px solid rgba(216,180,106,0.18)">
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #D8B46A">Fresh Orbit · Owner</span>
      <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 30px; line-height: 1.1">Dashboard</h1>
    </div>
    <div style="display: flex; gap: 8px">
      <a href="Main.dc.html" style="height: 44px; padding: 0 14px; border-radius: 22px; background: #121821; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; font-size: 13px; font-weight: 700">View shop</a>
      <a href="OwnerPin.dc.html" aria-label="Lock dashboard" style="width: 44px; height: 44px; border-radius: 22px; background: #121821; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2EDE3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></a>
    </div>
  </header>

  <nav aria-label="Owner sections" style="margin: 18px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 5px; background: #121821; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px">
    <a href="OwnerProducts.dc.html" style="height: 46px; border-radius: 15px; color: #C9CFD6; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">Products</a>
    <a href="OwnerDelivery.dc.html" aria-current="page" style="height: 46px; border-radius: 15px; background: #D8B46A; color: #1A1408; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">Delivery</a>
  </nav>

  <!-- Orders -->
  <section style="margin: 18px 20px 0; padding: 18px; border-radius: 22px; background: #121821; border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 24px">Orders</h2>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: {{statusColor}}"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{statusColor}}"></span>{{statusText}}</span>
      </div>
      <button role="switch" aria-checked="{{openAria}}" aria-label="Taking orders" onClick="{{toggleOpen}}" style="width: 60px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center">
        <span style="width: 54px; height: 32px; border-radius: 16px; background: {{track}}; position: relative; display: block"><span style="position: absolute; top: 4px; left: {{knobLeft}}; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.4)"></span></span>
      </button>
    </div>
    <label style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #9AA3AF">WhatsApp number for orders</span>
      <input type="tel" value="+91 98480 12345" style="height: 50px; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: #0A0E14; color: #F2EDE3; font-size: 15px; font-weight: 600">
    </label>
  </section>

  <!-- Areas -->
  <section style="margin: 14px 20px 0; padding: 18px; border-radius: 22px; background: #121821; border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 24px">Delivery charge by area</h2>
    </div>
    <sc-for list="{{areas}}" as="a" hint-placeholder-count="12">
      <div style="display: flex; gap: 8px; align-items: center">
        <input type="text" aria-label="Area name" value="{{a.name}}" style="flex: 1; min-width: 0; height: 46px; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); background: #0A0E14; color: #F2EDE3; font-size: 14px">
        <label style="width: 78px; height: 46px; display: flex; align-items: center; gap: 4px; padding: 0 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); background: #0A0E14">
          <span style="font-size: 13px; color: #9AA3AF">₹</span>
          <input type="text" inputmode="numeric" aria-label="Charge for {{a.name}}" value="{{a.fee}}" style="width: 100%; border: 0; background: transparent; color: #E9CC8C; font-size: 14px; font-weight: 800">
        </label>
        <button aria-label="Remove {{a.name}}" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: transparent; color: #9AA3AF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
    </sc-for>
    <button style="margin-top: 4px; height: 48px; border-radius: 14px; border: 1px dashed rgba(216,180,106,0.5); background: transparent; color: #D8B46A; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add area</button>
  </section>

  <!-- Rules -->
  <section style="margin: 14px 20px 0; padding: 18px; border-radius: 22px; background: #121821; border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 14px">
    <h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 24px">Order rules</h2>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12px; font-weight: 700; color: #9AA3AF">Free delivery above</span>
        <span style="height: 50px; display: flex; align-items: center; gap: 4px; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); background: #0A0E14"><span style="color: #9AA3AF">₹</span><input type="text" value="999" style="width: 100%; border: 0; background: transparent; color: #F2EDE3; font-size: 15px; font-weight: 700"></span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12px; font-weight: 700; color: #9AA3AF">Minimum order</span>
        <span style="height: 50px; display: flex; align-items: center; gap: 4px; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); background: #0A0E14"><span style="color: #9AA3AF">₹</span><input type="text" value="300" style="width: 100%; border: 0; background: transparent; color: #F2EDE3; font-size: 15px; font-weight: 700"></span>
      </label>
    </div>
  </section>

  <!-- Hours -->
  <section style="margin: 14px 20px 0; padding: 18px; border-radius: 22px; background: #121821; border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 14px">
    <h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 24px">Hours &amp; slots</h2>
    <label style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; color: #9AA3AF">Delivery hours</span>
      <input type="text" value="7 AM – 9 PM" style="height: 50px; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); background: #0A0E14; color: #F2EDE3; font-size: 15px; font-weight: 600">
    </label>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; color: #9AA3AF">Delivery time slots</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
          <span style="height: 44px; padding: 0 6px 0 14px; border-radius: 22px; background: rgba(216,180,106,0.1); border: 1px solid rgba(216,180,106,0.35); display: flex; align-items: center; gap: 2px; font-size: 13px; font-weight: 700; color: #E9CC8C">{{s}}<button aria-label="Remove slot {{s}}" style="width: 32px; height: 32px; border: 0; background: transparent; color: #9AA3AF; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></span>
        </sc-for>
        <button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px dashed rgba(255,255,255,0.2); background: transparent; color: #C9CFD6; font-size: 13px; font-weight: 700">+ Slot</button>
      </div>
    </div>
  </section>

  <!-- Message + PIN -->
  <section style="margin: 14px 20px 0; padding: 18px; border-radius: 22px; background: #121821; border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 14px">
    <h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 24px">Shop banner &amp; security</h2>
    <label style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; color: #9AA3AF">Message on shop <span style="font-weight: 500">(optional)</span></span>
      <input type="text" value="ఈరోజు పులస వచ్చింది!" style="height: 50px; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); background: #0A0E14; color: #F2EDE3; font-size: 15px; font-family: 'Anek Telugu', sans-serif">
    </label>
    <label style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; color: #9AA3AF">Owner PIN</span>
      <input type="password" value="1234" style="height: 50px; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); background: #0A0E14; color: #F2EDE3; font-size: 18px; letter-spacing: 6px">
    </label>
  </section>

  <div style="margin: 22px 20px 0; display: flex; gap: 10px">
    <button style="height: 58px; padding: 0 22px; border-radius: 29px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: #C9CFD6; font-size: 15px; font-weight: 700">Reset</button>
    <button style="flex: 1; height: 58px; border-radius: 29px; border: 0; background: linear-gradient(135deg, #E9CC8C 0%, #D8B46A 55%, #B8924A 100%); color: #1A1408; font-size: 16px; font-weight: 800; box-shadow: 0 14px 30px rgba(0,0,0,0.45)">Save changes</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { open: true }; }
  renderVals() {
    const open = this.state.open;
    const areas = [['Ramanayyapeta',20],['Suryaraopeta',30],['Jagannaickpur',30],['Gandhinagar',30],['Bhanugudi',30],['Ramaraopeta',30],['Sarpavaram',40],['Kondayapalem',40],['Turangi',50],['Madhavapatnam',50],['Vakalapudi',50],['Other area in Kakinada',60]].map(([name, fee]) => ({ name, fee: String(fee) }));
    return {
      areas, slots: ['7 – 10 AM', '12 – 3 PM', '5 – 8 PM'],
      toggleOpen: () => this.setState({ open: !open }),
      openAria: open ? 'true' : 'false',
      statusText: open ? 'Taking orders' : 'Closed · shop shows “Not taking orders”',
      statusColor: open ? '#4ADE80' : '#F59E0B',
      track: open ? '#1F7A4D' : 'rgba(255,255,255,0.14)',
      knobLeft: open ? '26px' : '4px'
    };
  }
}
</script>
</body>
</html>
